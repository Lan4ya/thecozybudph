name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Cache Deno dependencies
        uses: actions/cache@v4
        with:
          path: ~/.deno
          key: deno-${{ hashFiles('backend/supabase/functions/**/*.ts', 'backend/deno.json*') }}
          restore-keys: deno-

      - run: pnpm install --frozen-lockfile

      - name: Typecheck Project Wide
        run: pnpm type

      - name: Build Frontend
        run: pnpm build:fe
